
<div class="row my-3 justify-content-end">
    <button routerLink="add"
    mat-raised-button color="primary">Add User</button>
</div>

<div class="row ">
    <div class="col-md-4">
        <ul class="list-group">
            <li 
            *ngFor="let user of userArr"
            [routerLink]="user.id"
            class="list-group-item">
                {{user.name}} {{user.id}}
            </li>
        </ul>
    </div>

    <div class="col-md-8">
        <router-outlet></router-outlet>
    </div>
</div>
