<div class="row" *ngIf="product">
    <div class="col-md-6">
        <mat-card>
           <div class="row justify-content-between">
             <div class="col-10">
                <h3 class="font-weight-bold">
                {{product.title}}
                </h3>
             </div>
             <div class="col-2">
                <strong class="badge badge-success">
                {{product.rating.rate}}
                </strong>
             </div>
            

           </div>

            <img 
            mat-card-image
            [title]="product.title"
            [src]="product.image" 
            [alt]="product.title">

           
        </mat-card>
    </div>
    <div class="col-6">
        <mat-card>
            <h4 class="font-weight-bold">
                {{product.category |titlecase}}
            </h4>

            <hr>

            <p class="font-italic">
                {{product.description | titlecase}}
            </p>

            <strong class="badge badge-warning">
                $ {{product.price}}
            </strong>

            <mat-card-actions class="d-flex justify-content-between">
                <button
                (click)="navigatetoForm()"
                mat-raised-button
                color="primary">
                  Edit
                </button>
                <button 
                (click)="onRemove()"
                mat-raised-button 
                color="warn">
                    Remove
                </button>
            </mat-card-actions>
        </mat-card>
    </div>
</div>
